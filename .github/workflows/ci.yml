name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            asan_options: "detect_leaks=1:halt_on_error=1"
          - runner: macos-latest
            asan_options: "detect_leaks=0:halt_on_error=1"
    runs-on: ${{ matrix.runner }}
    env:
      TSCC_REGRESSION_SUITE_DIR: ${{ github.workspace }}/tscc-regression-suite
    steps:
      - name: Check out TSCC
        uses: actions/checkout@v4
        with:
          path: tscc
      - name: Check out pinned regression contract
        uses: actions/checkout@v4
        with:
          repository: tscc-project/tscc-regression-suite
          ref: 8a6ecd9a4f6ea9658cd7011286e575bd33c57d9f
          path: tscc-regression-suite
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - name: Install test oracles
        run: npm ci
        working-directory: tscc-regression-suite
      - name: Build
        run: make -j2
        working-directory: tscc
      - name: Test
        run: make test
        working-directory: tscc
      - name: Sanitize build
        run: make test-sanitize
        working-directory: tscc
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: make mingw-w64-ucrt-x86_64-gcc diffutils
      - name: Build and core tests (msys2)
        shell: msys2 {0}
        run: |
          make -j2
          make test-core
