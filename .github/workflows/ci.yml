name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unix:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            asan_options: "detect_leaks=1:halt_on_error=1"
          - runner: macos-latest
            asan_options: "detect_leaks=0:halt_on_error=1"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test oracles
        run: |
          npm install -g typescript
      - name: Build
        run: make -j2
      - name: Test
        run: make test
      - name: Sanitize build
        run: make test-sanitize
        env:
          ASAN_OPTIONS: ${{ matrix.asan_options }}

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: make mingw-w64-ucrt-x86_64-gcc diffutils
      - name: Build and core tests (msys2)
        shell: msys2 {0}
        run: |
          npm install -g typescript
          make -j2
          make test-core
      - name: Regression corpus (native)
        shell: pwsh
        run: |
          npm install -g typescript
          python regression/run.py --tscc "$PWD\tscc.exe"
